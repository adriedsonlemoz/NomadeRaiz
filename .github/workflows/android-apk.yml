name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar e gerar frontend
        run: npm run build

      - name: Criar Android limpo e compatível com Capacitor 8
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verificar configuração Android gerada
        shell: bash
        run: |
          test -x android/gradlew || chmod +x android/gradlew
          grep -q "minSdkVersion = 24" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "com.android.tools.build:gradle:8.13.0" android/build.gradle
          grep -q "gradle-8.14.3-all.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Gerar APK debug instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar nome do APK
        id: apk
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_NAME="NomadeRaiz-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: NomadeRaiz-Android-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14
