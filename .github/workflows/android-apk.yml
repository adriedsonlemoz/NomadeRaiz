name: Build Android APK
run-name: APK Android • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  apk:
    name: Gerar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Mostrar ambiente
        shell: bash
        run: |
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          node --version
          npm --version

      - name: Verificar estratégia de dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json encontrado."
          else
            echo "Sem package-lock.json: cache automático do setup-node foi desativado e será usado npm install."
          fi

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar e gerar frontend
        run: npm run build

      - name: Criar Android limpo e sincronizar Capacitor 8
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Aplicar ícone e identidade Android
        run: npm run android:branding

      - name: Verificar ícones Android
        shell: bash
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q "#F3E6C8" android/app/src/main/res/values/ic_launcher_background.xml
          echo "Ícones Android personalizados validados."

      - name: Verificar configuração Android gerada
        shell: bash
        run: |
          chmod +x android/gradlew
          test -f android/variables.gradle
          test -f android/app/build.gradle
          grep -q "minSdkVersion = 24" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "com.android.tools.build:gradle:8.13.0" android/build.gradle
          grep -q "gradle-8.14.3-all.zip" android/gradle/wrapper/gradle-wrapper.properties
          echo "Configuração Android validada."

      - name: Gerar APK debug instalável
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Localizar e validar APK
        id: apk
        shell: bash
        run: |
          echo "Arquivos produzidos pelo Gradle:"
          find android/app/build/outputs -maxdepth 6 -type f -print || true

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"

          VERSION=$(node -p "require('./package.json').version")
          APK_NAME="NomadeRaiz-${VERSION}-debug.apk"
          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/$APK_NAME"

          echo "path=artifacts/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK pronto: artifacts/$APK_NAME"
          ls -lh "artifacts/$APK_NAME"

      - name: Publicar APK nos artefatos
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: NomadeRaiz-Android-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do APK
        if: success()
        shell: bash
        run: |
          {
            echo "## ✅ APK gerado com sucesso"
            echo ""
            echo "- **Arquivo:** \`${{ steps.apk.outputs.name }}\`"
            echo "- **Artefato:** \`NomadeRaiz-Android-${{ github.run_number }}\`"
            echo "- **Branch/tag:** \`${{ github.ref_name }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "Baixe o APK na seção **Artifacts** desta execução."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico se o APK não for publicado
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ APK não foi publicado"
            echo ""
            echo "Veja a primeira etapa vermelha acima. A árvore de saída encontrada foi:"
            echo '```text'
            find android/app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || echo "Nenhuma saída Android encontrada."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
