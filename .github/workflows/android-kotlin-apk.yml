name: Android Kotlin APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths: [ "app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-kotlin-apk.yml" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nomade-Raiz.apk
      - name: Publish APK only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nômade Raiz v${{ steps.version.outputs.version }}
          body: "APK Android — versão ${{ steps.version.outputs.version }}"
          files: Nomade-Raiz.apk
          fail_on_unmatched_files: true
          make_latest: true
