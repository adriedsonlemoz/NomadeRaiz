name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Instalar dependências fixadas
        run: npm install --no-audit --no-fund

      - name: Test, typecheck and build
        run: npm run build
